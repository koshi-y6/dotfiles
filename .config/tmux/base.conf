# Set prefix key to C-f
set -g prefix C-f
unbind C-b

# Split window bindings
bind d split-window -h -c "#{pane_current_path}"
bind v split-window -v -c "#{pane_current_path}"
bind s choose-tree -Zw -F '#[fg=colour45,bg=default]#{window_name}'

set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

bind r source-file ~/.tmux.conf \; display "Reloaded!"

# Move panes with vim key bindings
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Cancel prefix press with C-j
bind-key -T prefix C-f run-shell "tmux send-keys "

# Detach session with Escape
bind Escape detach

# Resize mode (repeatable)
bind R display-message "Resize mode (hjkl to resize, Escape to exit)" \; switch-client -T resize
bind -T resize h resize-pane -L 5 \; switch-client -T resize
bind -T resize j resize-pane -D 5 \; switch-client -T resize
bind -T resize k resize-pane -U 5 \; switch-client -T resize
bind -T resize l resize-pane -R 5 \; switch-client -T resize
bind -T resize Escape switch-client -T root

# Arrow keys also work in resize mode
bind -T resize Left resize-pane -L 5 \; switch-client -T resize
bind -T resize Down resize-pane -D 5 \; switch-client -T resize
bind -T resize Up resize-pane -U 5 \; switch-client -T resize
bind -T resize Right resize-pane -R 5 \; switch-client -T resize

# Theurgia plugin hooks
set-hook -g client-session-changed "run-shell '~/.tmux/work_time_gauge/work_time_gauge.sh #{session_name} start'"
set-hook -g client-detached "run-shell '~/.tmux/work_time_gauge/work_time_gauge.sh #{session_name} stop'"
bind-key T run-shell "~/.tmux/work_time_gauge/theurgia.sh #{session_name}"

# Set the window-status format
setw -g window-status-format "#I:#W "

# Enable mouse operation
set -g mouse on

# Vim key bindings in copy mode
setw -g mode-keys vi

# Disable visual notification
setw -g monitor-activity off
set -g visual-activity off

# Avoid checkhealth
set -g escape-time 10
set -g focus-events on
set -g history-limit 50000

# Terminal color
set -g default-terminal "tmux-256color"
set -sag terminal-features ",*:RGB"
set -sag terminal-features ",*:usstyle"

# Copy to clipboard from copy mode in tmux
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"

# tmux choose tree color options reference is tmux/options.c line 524, tmux/window-tree.c line 101
set-option -g display-panes-colour colour231
set-option -g display-panes-active-colour colour45
set -g message-style "fg=colour81,bg=colour61, bold"
set -g message-command-style "fg=colour81,bg=colour61, bold"
set -g mode-style "fg=black,bg=colour67"

# # Image display support
# set -gq allow-passthrough on
